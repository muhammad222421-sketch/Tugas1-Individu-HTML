<!DOCTYPE html>
<html>
<head>
  <title>Aritmatika Sederhana</title>
</head>
<body>
  <h3>Tugas 3 Program Aritmatika</h3>

  Bilangan 1: <input id="bil1" type="number"><br><br>
  Bilangan 2: <input id="bil2" type="number"><br><br>

  <button onclick="hitung('+')">+</button>
  <button onclick="hitung('-')">-</button>
  <button onclick="hitung('*')">*</button>
  <button onclick="hitung('/')">/</button>

  <p>Hasil: <span id="hasil"></span></p>

  <script>
    function hitung(op) {
      let a = parseFloat(document.getElementById("bil1").value);
      let b = parseFloat(document.getElementById("bil2").value);
      let hasil = 0;

      if (op == "+") hasil = a + b;
      else if (op == "-") hasil = a - b;
      else if (op == "*") hasil = a * b;
      else if (op == "/") hasil = a / b;

      document.getElementById("hasil").innerText = hasil;
    }
  </script>
</body>
</html>
